x;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Canales humanos para resolución y excepciones.<\u002Fspan><\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div style=\"border:1px solid #E3E2EB;border-radius:28px;padding:30px;display:flex;flex-direction:column\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Ejemplo<\u002Fdiv>\n<div style=\"margin-top:16px;display:flex;flex-direction:column;gap:10px\"><p style=\"margin:0;font-weight:300;font-size:clamp(18px,1.5vw,21px);line-height:1.5;color:#201C4E;text-wrap:pretty\">Un cliente delega la comparación y adquisición de un producto en su asistente.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#201C4E;border-radius:28px;padding:30px;display:flex;flex-direction:column\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Pregunta para la organización<\u002Fdiv>\n<div style=\"margin-top:16px\"><p style=\"margin:0;font-weight:900;font-size:clamp(20px,1.8vw,24px);line-height:1.3;color:#fff;text-wrap:pretty\"><strong style=\"font-weight:900\">¿Estamos preparados para relacionarnos con un cliente que delega parte de su decisión en un agente?<\u002Fstrong><\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:22px 0 0;font-weight:300;font-size:14px;line-height:1.5;color:#4A4766\"><strong style=\"font-weight:900\">Fuentes: <\u002Fstrong>Gartner CX 2026; Forrester Predictions 2026.<\u002Fp>\n<\u002Farticle><article id=\"tendencia-10\" style=\"scroll-margin-top:60px;padding:clamp(56px,7vw,96px) 0;border-top:1px solid #E3E2EB\">\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(28px,5vw,80px)\">\n<div style=\"flex:1 1 340px;max-width:470px\">\n<div style=\"display:flex;align-items:center;gap:14px;font-weight:900;font-size:13px;letter-spacing:0.1 t:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Más interoperabilidad.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Uso de APIs.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Mayor observabilidad.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Gestión de diferentes modelos.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Atención a residencia y soberanía del dato.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Menor dependencia de un único proveedor.<\u002Fspan><\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div style=\"border:1px solid #E3E2EB;border-radius:28px;padding:30px;display:flex;flex-direction:column\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Ejemplo<\u002Fdiv>\n<div style=\"margin-top:16px;display:flex;flex-direction:column;gap:10px\"><p style=\"margin:0;font-weight:300;font-size:clamp(18px,1.5vw,21px);line-height:1.5;color:#201C4E;text-wrap:pretty\">Una organización cambia el modelo de IA utilizado por un proceso sin tener que reconstruirlo.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#201C4E;border-radius:28px;padding:30px;display:flex;flex-direction:column\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Pregunta para la organización<\u002Fdiv>\n<div style=\"margin-top:16px\"><p style=\"margin:0;font-weight:900;font-size:clamp(20px,1.8vw,24px);line-height:1.3;color:#fff;text-wrap:pretty\"><strong style=\"font-weight:900\">¿Nuestra tecnología acelera nuestra capacidad de cambiar o la limita?<\u002Fstrong><\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:22px 0 0;font-weight:300;font-size:14px;line-height:1.5;color:#4A4766\"><strong style=\"font-weight:900\">Fuentes: <\u002Fstrong>Gartner Strategic Technology Trends 2026; IBM.<\u002Fp>\n<\u002Farticle><\u002Fdiv><\u002Fsection>\n<section id=\"bloque-4\" style=\"scroll-margin-top:60px;background:#201C4E;color:#fff;padding:clamp(80px,10vw,140px) 0 clamp(72px,9vw,120px)\"><div style=\"max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,72px);\">\n<div style=\"font-weight:900;font-size:clamp(64px,9vw,128px);line-height:0.9;color:#FF4F52\"><span style=\"opacity:0.55\">/<\u002Fspan>04<\u002Fdiv>\n<div style=\"margin-top:28px\"><div style=\"display:flex;align-items:center;gap:14px;font-weight:900;font-size:13px;letter-spacing:0.18em;color:#fff\"><span style=\"width:40px;height:1px;background:#fff;opacity:0.6;flex:none\"><\u002Fspan><span>BLOQUE 04 · OPERAR CON DATOS<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(32px,5vw,80px)\">\n<div style=\"flex:1 1 420px;max-width:620px\"><h2 style=\"margin:20px 0 0;font-weight:900;font-size:clamp(32px,4.4vw,58px);line-height:1.04;letter-spacing:0.01em;color:#fff;text-wrap:balance\">Los datos dejan de terminar en un informe y empiezan a entrar en la operación.<\u002Fh2><\u002Fdiv>\n<div style=\"flex:1 1 380px;display:flex;flex-direction:column;gap:16px;padding-top:26px\"><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:rgba(255,255,255,0.86);text-wrap:pretty\">Durante años, el objetivo ha sido disponer de más información para tomar decisiones.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:rgba(255,255,255,0.86);text-wrap:pretty\">Ahora aparece una nueva posibilidad:<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:rgba(255,255,255,0.86);text-wrap:pretty\">que los propios sistemas utilicen esa información para predecir, recomendar e incluso actuar.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:rgba(255,255,255,0.86);text-wrap:pretty\">Esto acerca datos, modelos y operación.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:rgba(255,255,255,0.86);text-wrap:pretty\">Y convierte su fiabilidad y gobernanza en cuestiones de negocio.<\u002Fp><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section style=\"background:#fff\"><div style=\"max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,72px);\"><article id=\"tendencia-11\" style=\"scroll-margin-top:60px;padding:clamp(56px,7vw,96px) 0;border-top:none\">\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(28px,5vw,80px)\">\n<div style=\"flex:1 1 340px;max-width:470px\">\n<div style=\"display:flex;align-items:center;gap:14px;font-weight:900;font-size:13px;letter-spacing:0.18em;color:#FF4F52\"><span style=\"width:40px;height:1px;background:#FF4F52;opacity:0.6;flex:none\"><\u002Fspan><span>TENDENCIA 11<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin:18px 0 0;font-weight:900;font-size:clamp(30px,3.4vw,46px);line-height:1.06;letter-spacing:0.01em;color:#201C4E;text-wrap:balance\">Sistemas inteligentes de decisión<\u002Fh3>\n<p style=\"margin:22px 0 0;padding-left:18px;border-left:3px solid #FF4F52;font-weight:300;font-style:italic;font-size:clamp(18px,1.6vw,22px);line-height:1.4;color:#201C4E;text-wrap:pretty\">De explicar lo que ocurrió a intervenir sobre lo que ocurrirá.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1.3 1 400px;display:flex;flex-direction:column;gap:14px;padding-top:6px\"><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">La analítica ha evolucionado desde describir el pasado hacia predecir escenarios.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">La siguiente etapa incorpora recomendaciones y acciones controladas.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">El dato deja así de ser únicamente una herramienta para informar.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Empieza a participar directamente en el funcionamiento de la organización.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:clamp(36px,4vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;align-items:stretch\">\n<div style=\"background:#F2F1F6;border-radius:28px;padding:30px 30px 22px\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Qué cambia<\u002Fdiv>\n<ul style=\"list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column\"><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-w 1px);line-height:1.5;color:#201C4E;text-wrap:pretty\">Un sistema detecta riesgo de stock, simula escenarios y propone compras.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#201C4E;border-radius:28px;padding:30px;display:flex;flex-direction:column\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Pregunta para la organización<\u002Fdiv>\n<div style=\"margin-top:16px\"><p style=\"margin:0;font-weight:900;font-size:clamp(20px,1.8vw,24px);line-height:1.3;color:#fff;text-wrap:pretty\"><strong style=\"font-weight:900\">¿Nuestros datos explican el negocio o están ayudando ya a operar el negocio?<\u002Fstrong><\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:22px 0 0;font-weight:300;font-size:14px;line-height:1.5;color:#4A4766\"><strong style=\"font-weight:900\">Fuentes: <\u002Fstrong>BCG; IBM.<\u002Fp>\n<\u002Farticle><article id=\"tendencia-12\" style=\"scroll-margin-top:60px;padding:clamp(56px,7vw,96px) 0;border-top:1px solid #E3E2EB\">\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(28px,5vw,80px)\">\n<div style=\"flex:1 1 340px;max-width:470px\">\n<div style=\"display:flex;align-items:center;gap:14px;font-weight:900;font-size:13px;letter-spacing:0.18em;color:#FF4F52\"><span style=\"width:40px;height:1px;background:#FF4F52;opacity:0.6;flex:none\"><\u002Fspan><span>TENDENCIA 12<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin:18px 0 0;font-weight:900;font-size:clamp(30px,3.4vw,46px);line-height:1.06;letter-spacing:0.01em;color:#201C4E;text-wrap:balance\">Gobernanza y ciberresiliencia<\u002Fh3>\n<p style=\"margin:22px 0 0;padding-left:18px;border-left:3px solid #FF4F52;font-weight:300;font-style:italic;font-size:clamp(18px,1.6vw,22px);line-height:1.4;color:#201C4E;text-wrap:pretty\">Cuanta más autonomía damos a los sistemas, mayor claridad necesitan sus límites.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1.3 1 400px;display:flex;flex-direction:column;gap:14px;padding-top:6px\"><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">La incorporación de agentes capaces de interactuar con procesos y sistemas amplía la superficie de riesgo.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Gobernar la IA deja de consistir solamente en controlar modelos.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">También implica determinar identidades, permisos, límites, trazabilidad y mecanismos de supervisión.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:clamp(36px,4vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;align-items:stretch\">\n<div style=\"background:#F2F1F6;border-radius:28px;padding:30px 30px 22px\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Qué cambia<\u002Fdiv>\n<ul style=\"list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column\"><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Identidad y permisos.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Límites de actuación.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Registro de acciones.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Evaluación continua.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Supervisión proporcional al riesgo.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Responsabilidad clara.<\u002Fspan><\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div style=\"border:1px solid #E3E2EB;border-radius:28px;padding:30px;display:flex;flex-direction:column\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Ejemplo<\u002Fdiv>\n<div style=\"margin-top:16px;display:flex;flex-direction:column;gap:10px\"><p style=\"margin:0;font-weight:300;font-size:clamp(18px,1.5vw,21px);line-height:1.5;color:#201C4E;text-wrap:pretty\">Un agente financiero necesita autorización cuando una operación supera un determinado umbral.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#201C4E;border-radius:28px;padding:30px;display:flex;flex-direction:column\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Pregunta para la organización<\u002Fdiv>\n<div style=\"margin-top:16px\"><p style=\"margin:0;font-weight:900;font-size:clamp(20px,1.8vw,24px);line-height:1.3;color:#fff;text-wrap:pretty\"><strong style=\"font-weight:900\">¿Sabemos qué puede hacer cada sistema, con qué información y hasta dónde puede actuar?<\u002Fstrong><\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:22px 0 0;font-weight:300;font-size:14px;line-height:1.5;color:#4A4766\"><strong style=\"font-weight:900\">Fuentes: <\u002Fstrong>Gartner Strategic Technology Trends 2026; Deloitte.<\u002Fp>\n<\u002Farticle><article id=\"tendencia-13\" style=\"scroll-margin-top:60px;padding:clamp(56px,7vw,96px) 0;border-top:1px solid #E3E2EB\">\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(28px,5vw,80px)\">\n<div style=\"flex:1 1 340px;max-width:470px\">\n<div style=\"display:flex;align-items:center;gap:14px;font-weight:900;font-size:13px;letter-spacing:0.18em;color:#FF4F52\"><span style=\"width:40px;height:1px;background:#FF4F52;opacity:0.6;flex:none\"><\u002Fspan><span>TENDENCIA 13<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin:18px 0 0;font-weight:900;font-size:clamp(30px,3.4vw,46px);line-height:1.06;letter-spacing:0.01em;color:#201C4E;text-wrap:balance\">Resiliencia y sostenibilidad estratégica<\u002Fh3>\n<p style=\"margin:22px 0 0;padding-left:18px;border-left:3px solid #FF4F52;font-weight:300;font-style:italic;font-size:clamp(18px,1.6vw,22px);line-height:1.4;color:#201C4E;text-wrap:pretty\">La operación empieza a diseñarse para funcionar también cuando el contexto cambia.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1.3 1 400px;display:flex;flex-direction:column;gap:14px;padding-top:6px\"><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Geopolítica, energía, clima y suministro están aumentando la incertidumbre operativa.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">La respuesta no puede ser optimizar únicamente para el escenario esperado.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Las organizaciones necesitan combinar eficiencia con capacidad de adaptación.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:clamp(36px,4vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;align-items:stretch\">\n<div style=\"background:#F2F1F6;border-radius:28px;padding:30px 30px 22px\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Qué cambia<\u002Fdiv>\n<ul style=\"list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column\"><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Más planificación por escenarios.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Diversificación.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Mayor visibilidad del suministro.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Conexión entre continuidad, coste y sostenibilidad.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Uso de datos para anticipar riesgos.<\u002Fspan><\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div style=\"border:1px solid #E3E2EB;border-radius:28px;padding:30px;display:flex;flex-direction:column\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Ejemplo<\u002Fdiv>\n<div style=\"margin-top:16px;display:flex;flex-direction:column;gap:10px\"><p style=\"margin:0;font-weight:300;font-size:clamp(18px,1.5vw,21px);line-height:1.5;color:#201C4E;text-wrap:pretty\">Datos de clima, consumo y transporte permiten anticipar interrupciones de producción.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#201C4E;border-radius:28px;padding:30px;display:flex;flex-direction:column\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Pregunta para la organización<\u002Fdiv>\n<div style=\"margin-top:16px\"><p style=\"margin:0;font-weight:900;font-size:clamp(20px,1.8vw,24px);line-height:1.3;color:#fff;text-wrap:pretty\"><strong style=\"font-weight:900\">¿Nuestro modelo operativo está diseñado únicamente para cuando todo ocurre según lo previsto?<\u002Fstrong><\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:22px 0 0;font-weight:300;font-size:14px;line-height:1.5;color:#4A4766\"><strong style=\"font-weight:900\">Fuentes: <\u002Fstrong>Capgemini A World in Balance 2026; PwC.<\u002Fp>\n<\u002Farticle><\u002Fdiv><\u002Fsection>\n<section id=\"bloque-5\" style=\"scroll-margin-top:60px;background:#201C4E;color:#fff;padding:clamp(80px,10vw,140px) 0 clamp(72px,9vw,120px)\"><div style=\"max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,72px);\">\n<div style=\"font-weight:900;font-size:clamp(64px,9vw,128px);line-height:0.9;color:#FF4F52\"><span style=\"opacity:0.55\">/<\u002Fspan>05<\u002Fdiv>\n<div style=\"margin-top:28px\"><div style=\"display:flex;align-items:center;gap:14px;font-weight:900;font-size:13px;letter-spacing:0.18em;color:#fff\"><span style=\"width:40px;height:1px;background:#fff;opacity:0.6;flex:none\"><\u002Fspan><span>BLOQUE 05 · EVOLUCIONAR<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(32px,5vw,80px)\">\n<div style=\"flex:1 1 420px;max-width:620px\"><h2 style=\"margin:20px 0 0;font-weight:900;font-size:clamp(32px,4.4vw,58px);line-height:1.04;letter-spacing:0.01em;color:#fff;text-wrap:balance\">La tecnología cambia rápido. Las organizaciones necesitan aprender al mismo ritmo.<\u002Fh2><\u002Fdiv>\n<div style=\"flex:1 1 380px;display:flex;flex-direction:column;gap:16px;padding-top:26px\"><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:rgba(255,255,255,0.86);text-wrap:pretty\">Ninguna de las transformaciones anteriores puede sostenerse únicamente con tecnología.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:rgba(255,255,255,0.86);text-wrap:pretty\">Cambian los roles.<br>Cambian las decisiones.<br>Cambian los procesos.<br>Cambian las capacidades que hacen valiosa a una persona dentro de un equipo.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:rgba(255,255,255,0.86);text-wrap:pretty\">Por eso, desarrollar capacidad de adaptación deja de ser una iniciativa de formación y empieza a convertirse en una cuestión de diseño organizativo.<\u002Fp><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section style=\"background:#fff\"><div style=\"max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,72px);\"><article id=\"tendencia-14\" style=\"scroll-margin-top:60px;padding:clamp(56px,7vw,96px) 0;border-top:none\">\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(28px,5vw,80px)\">\n<div style=\"flex:1 1 340px;max-width:470px\">\n<div style=\"display:flex;align-items:center;gap:14px;font-weight:900;font-size:13px;letter-spacing:0.18em;color:#FF4F52\"><span style=\"width:40px;height:1px;background:#FF4F52;opacity:0.6;flex:none\"><\u002Fspan><span>TENDENCIA 14<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin:18px 0 0;font-weight:900;font-size:clamp(30px,3.4vw,46px);line-height:1.06;letter-spacing:0.01em;color:#201C4E;text-wrap:balance\">Talento basado en habilidades<\u002Fh3>\n<p style=\"margin:22px 0 0;padding-left:18px;border-left:3px solid #FF4F52;font-weight:300;font-style:italic;font-size:clamp(18px,1.6vw,22px);line-height:1.4;color:#201C4E;text-wrap:pretty\">Los puestos cambian más rápido que las estructuras que los describen.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1.3 1 400px;display:flex;flex-direction:column;gap:14px;padding-top:6px\"><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Las habilidades verificables y actualizables ganan relevancia frente a las descripciones rígidas de puesto.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Cuando el trabajo evoluciona continuamente, las organizaciones necesitan saber qué capacidades tienen, cuáles necesitan y cómo pueden desarrollarlas.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:clamp(36px,4vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;align-items:stretch\">\n<div style=\"background:#F2F1F6;border-radius:28px;padding:30px 30px 22px\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Qué cambia<\u002Fdiv>\n<ul style=\"list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column\"><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Taxonomías de capacidades.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Mapas de polivalencia.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Movilidad interna.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Reskilling continuo.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Itinerarios de desarrollo más dinámicos.<\u002Fspan><\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div style=\"border:1px solid #E3E2EB;border-radius:28px;padding:30px;display:flex;flex-direction:column\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Ejemplo<\u002Fdiv>\n<div style=\"margin-top:16px;display:flex;flex-direction:column;gap:10px\"><p style=\"margin:0;font-weight:300;font-size:clamp(18px,1.5vw,21px);line-height:1.5;color:#201C4E;text-wrap:pretty\">Un analista de procesos desarrolla capacidades de automatización y diseño de agentes.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#201C4E;border-radius:28px;padding:30px;display:flex;flex-direction:column\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Pregunta para la organización<\u002Fdiv>\n<div style=\"margin-top:16px\"><p style=\"margin:0;font-weight:900;font-size:clamp(20px,1.8vw,24px);line-height:1.3;color:#fff;text-wrap:pretty\"><strong style=\"font-weight:900\">¿Gestionamos a las personas por el puesto que ocupan hoy o por la capacidad que pueden aportar mañana?<\u002Fstrong><\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:22px 0 0;font-weight:300;font-size:14px;line-height:1.5;color:#4A4766\"><strong style=\"font-weight:900\">Fuentes: <\u002Fstrong>WEF Future of Jobs 2025; Deloitte.<\u002Fp>\n<\u002Farticle><article id=\"tendencia-15\" style=\"scroll-margin-top:60px;padding:clamp(56px,7vw,96px) 0;border-top:1px solid #E3E2EB\">\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(28px,5vw,80px)\">\n<div style=\"flex:1 1 340px;max-width:470px\">\n<div style=\"display:flex;align-items:center;gap:14px;font-weight:900;font-size:13px;letter-spacing:0.18em;color:#FF4F52\"><span style=\"width:40px;height:1px;background:#FF4F52;opacity:0.6;flex:none\"><\u002Fspan><span>TENDENCIA 15<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin:18px 0 0;font-weight:900;font-size:clamp(30px,3.4vw,46px);line-height:1.06;letter-spacing:0.01em;color:#201C4E;text-wrap:balance\">Cultura de aprendizaje y confianza<\u002Fh3>\n<p style=\"margin:22px 0 0;padding-left:18px;border-left:3px solid #FF4F52;font-weight:300;font-style:italic;font-size:clamp(18px,1.6vw,22px);line-height:1.4;color:#201C4E;text-wrap:pretty\">Experimentar y cuestionar pasan a ser capacidades estratégicas.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1.3 1 400px;display:flex;flex-direction:column;gap:14px;padding-top:6px\"><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Trabajar con Inteligencia Artificial implica convivir con incertidumbre.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">No todos los experimentos funcionarán.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">No todos los outputs serán correctos.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">No todas las nuevas formas de trabajo sobrevivirán.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">La ventaja no estará en evitar cualquier error, sino en detectar antes qué funciona, aprender de ello y compartirlo con el resto de la organización.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:clamp(36px,4vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;align-items:stretch\">\n<div style=\"background:#F2F1F6;border-radius:28px;padding:30px 30px 22px\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Qué cambia<\u002Fdiv>\n<ul style=\"list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column\"><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Mayor seguridad psicológica.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Experimentación recurrente.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Pensamiento crítico.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Transparencia.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Aprendizaje compartido.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Confianza construida mediante evidencia.<\u002Fspan><\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div style=\"border:1px solid #E3E2EB;border-radius:28px;padding:30px;display:flex;flex-direction:column\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Ejemplo<\u002Fdiv>\n<div style=\"margin-top:16px;display:flex;flex-direction:column;gap:10px\"><p style=\"margin:0;font-weight:300;font-size:clamp(18px,1.5vw,21px);line-height:1.5;color:#201C4E;text-wrap:pretty\">Los equipos realizan experimentos recurrentes y publican aprendizajes y resultados.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#201C4E;border-radius:28px;padding:30px;display:flex;flex-direction:column\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Pregunta para la organización<\u002Fdiv>\n<div style=\"margin-top:16px\"><p style=\"margin:0;font-weight:900;font-size:clamp(20px,1.8vw,24px);line-height:1.3;color:#fff;text-wrap:pretty\"><strong style=\"font-weight:900\">¿Nuestra organización está diseñada para proteger lo que ya sabe o para aprender lo que todavía no sabe?<\u002Fstrong><\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:22px 0 0;font-weight:300;font-size:14px;line-height:1.5;color:#4A4766\"><strong style=\"font-weight:900\">Fuentes: <\u002Fstrong>Deloitte Human Capital Trends 2026.<\u002Fp>\n<\u002Farticle><\u002Fdiv><\u002Fsection>\n<section id=\"vision\" style=\"scroll-margin-top:60px;background:#201C4E;color:#fff;padding:clamp(80px,10vw,140px) 0\"><div style=\"max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,72px);\"><div style=\"display:flex;align-items:center;gap:14px;font-weight:900;font-size:13px;letter-spacing:0.18em;color:#FF4F52\"><span style=\"width:40px;height:1px;background:#FF4F52;opacity:0.6;flex:none\"><\u002Fspan><span>VISIÓN EJECUTIVA<\u002Fspan><\u002Fdiv>\n<h2 style=\"margin:20px 0 0;font-weight:900;font-size:clamp(32px,4.4vw,58px);line-height:1.04;letter-spacing:0.01em;color:#fff;text-wrap:balance\">Cinco transiciones que definen 2026<\u002Fh2>\n<p style=\"margin:20px 0 0;font-weight:300;font-size:clamp(18px,1.6vw,22px);color:rgba(255,255,255,0.86)\">Las quince tendencias convergen en cinco movimientos.<\u002Fp>\n<div style=\"margin-top:48px;display:flex;flex-direction:column;gap:16px\"><div style=\"background:#2C2A6D;border-radius:28px;padding:clamp(26px,3vw,40px);display:flex;flex-wrap:wrap;gap:clamp(20px,4vw,56px);align-items:center\">\n<div style=\"flex:1 1 360px\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:rgba(255,255,255,0.72)\"><span style=\"color:#FF4F52\">01 ·<\u002Fspan> DE GESTIONAR ACTIVIDAD<\u002Fdiv>\n<div style=\"margin:14px 0 0;display:flex;align-items:center;gap:14px\"><span style=\"width:36px;height:2px;background:#FF4F52;flex:none\"><\u002Fspan><span style=\"font-weight:900;font-size:clamp(22px,2.4vw,32px);line-height:1.1;letter-spacing:0.01em;color:#fff\">A DECIDIR DÓNDE PONER LA CAPACIDAD<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 380px;display:flex;flex-direction:column;gap:10px\"><p style=\"margin:0;font-weight:300;font-size:17px;line-height:1.55;color:rgba(255,255,255,0.88);text-wrap:pretty\">Cuando ejecutar se vuelve más sencillo, priorizar bien se convierte en un factor diferencial.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:17px;line-height:1.55;color:rgba(255,255,255,0.88);text-wrap:pretty\">No se trata de hacer más.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:17px;line-height:1.55;color:rgba(255,255,255,0.88);text-wrap:pretty\">Se trata de concentrar recursos en lo que realmente mueve la estrategia.<\u002Fp><\u002Fdiv>\n<\u002Fdiv><div style=\"background:#2C2A6D;border-radius:28px;padding:clamp(26px,3vw,40px);display:flex;flex-wrap:wrap;gap:clamp(20px,4vw,56px);align-items:center\">\n<div style=\"flex:1 1 360px\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:rgba(255,255,255,0.72)\"><span style=\"color:#FF4F52\">02 ·<\u002Fspan> DE AUTOMATIZAR TAREAS<\u002Fdiv>\n<div style=\"margin:14px 0 0;display:flex;align-items:center;gap:14px\"><span style=\"width:36px;height:2px;background:#FF4F52;flex:none\"><\u002Fspan><span style=\"font-weight:900;font-size:clamp(22px,2.4vw,32px);line-height:1.1;letter-spacing:0.01em;color:#fff\">A REDISEÑAR EL TRABAJO<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 380px;display:flex;flex-direction:column;gap:10px\"><p style=\"margin:0;font-weight:300;font-size:17px;line-height:1.55;color:rgba(255,255,255,0.88);text-wrap:pretty\">La eficiencia local tiene un límite.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:17px;line-height:1.55;color:rgba(255,255,255,0.88);text-wrap:pretty\">El siguiente salto aparece cuando la tecnología permite replantear el flujo, las decisiones y la responsabilidad sobre el resultado.<\u002Fp><\u002Fdiv>\n<\u002Fdiv><div style=\"background:#2C2A6D;border-radius:28px;padding:clamp(26px,3vw,40px);display:flex;flex-wrap:wrap;gap:clamp(20px,4vw,56px);align-items:center\">\n<div style=\"flex:1 1 360px\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:rgba(255,255,255,0.72)\"><span style=\"color:#FF4F52\">03 ·<\u002Fspan> DE CONSTRUIR MÁS RÁPIDO<\u002Fdiv>\n<div style=\"margin:14px 0 0;display:flex;align-items:center;gap:14px\"><span style=\"width:36px;height:2px;background:#FF4F52;flex:none\"><\u002Fspan><span style=\"font-weight:900;font-size:clamp(22px,2.4vw,32px);line-height:1.1;letter-spacing:0.01em;color:#fff\">A CONSTRUIR NUEVO VALOR<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 380px;display:flex;flex-direction:column;gap:10px\"><p style=\"margin:0;font-weight:300;font-size:17px;line-height:1.55;color:rgba(255,255,255,0.88);text-wrap:pretty\">La IA no solo cambia la velocidad de producción.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:17px;line-height:1.55;color:rgba(255,255,255,0.88);text-wrap:pretty\">Amplía el espacio de soluciones, productos, servicios y experiencias que pueden crearse.<\u002Fp><\u002Fdiv>\n<\u002Fdiv><div style=\"background:#2C2A6D;border-radius:28px;padding:clamp(26px,3vw,40px);display:flex;flex-wrap:wrap;gap:clamp(20px,4vw,56px);align-items:center\">\n<div style=\"flex:1 1 360px\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:rgba(255,255,255,0.72)\"><span style=\"color:#FF4F52\">04 ·<\u002Fspan> DE OBSERVAR CON DATOS<\u002Fdiv>\n<div style=\"margin:14px 0 0;display:flex;align-items:center;gap:14px\"><span style=\"width:36px;height:2px;background:#FF4F52;flex:none\"><\u002Fspan><span style=\"font-weight:900;font-size:clamp(22px,2.4vw,32px);line-height:1.1;letter-spacing:0.01em;color:#fff\">A OPERAR CON DATOS<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 380px;display:flex;flex-direction:column;gap:10px\"><p style=\"margin:0;font-weight:300;font-size:17px;line-height:1.55;color:rgba(255,255,255,0.88);text-wrap:pretty\">La información deja de terminar en un dashboard.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:17px;line-height:1.55;color:rgba(255,255,255,0.88);text-wrap:pretty\">Los sistemas empiezan a utilizarla para predecir, recomendar y actuar.<\u002Fp><\u002Fdiv>\n<\u002Fdiv><div style=\"background:#2C2A6D;border-radius:28px;padding:clamp(26px,3vw,40px);display:flex;flex-wrap:wrap;gap:clamp(20px,4vw,56px);align-items:center\">\n<div style=\"flex:1 1 360px\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:rgba(255,255,255,0.72)\"><span style=\"color:#FF4F52\">05 ·<\u002Fspan> DE FORMAR PARA EL CAMBIO<\u002Fdiv>\n<div style=\"margin:14px 0 0;display:flex;align-items:center;gap:14px\"><span style=\"width:36px;height:2px;background:#FF4F52;flex:none\"><\u002Fspan><span style=\"font-weight:900;font-size:clamp(22px,2.4vw,32px);line-height:1.1;letter-spacing:0.01em;color:#fff\">A DESARROLLAR CAPACIDAD DE CAMBIO<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 380px;display:flex;flex-direction:column;gap:10px\"><p style=\"margin:0;font-weight:300;font-size:17px;line-height:1.55;color:rgba(255,255,255,0.88);text-wrap:pretty\">Las capacidades necesarias evolucionan continuamente.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:17px;line-height:1.55;color:rgba(255,255,255,0.88);text-wrap:pretty\">Aprender y adaptarse pasan a formar parte del funcionamiento ordinario de la organización.<\u002Fp><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section id=\"empezar\" style=\"scroll-margin-top:60px;padding:clamp(80px,10vw,140px) 0\"><div style=\"max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,72px);\"><div style=\"display:flex;align-items:center;gap:14px;font-weight:900;font-size:13px;letter-spacing:0.18em;color:#FF4F52\"><span style=\"width:40px;height:1px;background:#FF4F52;opacity:0.6;flex:none\"><\u002Fspan><span>¿POR DÓNDE EMPEZAR?<\u002Fspan><\u002Fdiv>\n<div style=\"max-width:820px\"><h2 style=\"margin:20px 0 0;font-weight:900;font-size:clamp(32px,4.4vw,58px);line-height:1.04;letter-spacing:0.01em;color:#201C4E;text-wrap:balance\">No hace falta transformar toda la organización a la vez.<\u002Fh2><\u002Fdiv>\n<p style=\"margin:20px 0 0;max-width:720px;font-weight:300;font-size:clamp(18px,1.6vw,22px);line-height:1.5;color:#4A4766\">Las tendencias apuntan a cambios amplios, pero la transformación ocurre mediante problemas concretos.<\u002Fp>\n<div style=\"margin-top:48px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px\"><div style=\"border:1px solid #E3E2EB;border-radius:28px;padding:30px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"font-weight:900;font-size:40px;line-height:1;color:#FF4F52\">01 <span style=\"opacity:0.55\">·<\u002Fspan><\u002Fdiv>\n<div style=\"font-weight:900;font-size:20px;line-height:1.25;color:#201C4E\">Elegir un resultado<\u002Fdiv>\n<p style=\"margin:0;font-weight:300;font-size:16px;line-height:1.55;color:#4A4766\">Empezar por algo que importe de verdad al negocio, al cliente o a la operación.<\u002Fp><\u002Fdiv><div style=\"border:1px solid #E3E2EB;border-radius:28px;padding:30px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"font-weight:900;font-size:40px;line-height:1;color:#FF4F52\">02 <span style=\"opacity:0.55\">·<\u002Fspan><\u002Fdiv>\n<div style=\"font-weight:900;font-size:20px;line-height:1.25;color:#201C4E\">Entender cómo se produce hoy<\u002Fdiv>\n<p style=\"margin:0;font-weight:300;font-size:16px;line-height:1.55;color:#4A4766\">Observar decisiones, dependencias, datos, sistemas y puntos de fricción.<\u002Fp><\u002Fdiv><div style=\"border:1px solid #E3E2EB;border-radius:28px;padding:30px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"font-weight:900;font-size:40px;line-height:1;color:#FF4F52\">03 <span style=\"opacity:0.55\">·<\u002Fspan><\u002Fdiv>\n<div style=\"font-weight:900;font-size:20px;line-height:1.25;color:#201C4E\">Cuestionar el diseño actual<\u002Fdiv>\n<p style=\"margin:0;font-weight:300;font-size:16px;line-height:1.55;color:#4A4766\">No asumir que el proceso, el equipo o la solución actual deben mantenerse.<\u002Fp><\u002Fdiv><div style=\"border:1px solid #E3E2EB;border-radius:28px;padding:30px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"font-weight:900;font-size:40px;line-height:1;color:#FF4F52\">04 <span style=\"opacity:0.55\">·<\u002Fspan><\u002Fdiv>\n<div style=\"font-weight:900;font-size:20px;line-height:1.25;color:#201C4E\">Incorporar nuevas capacidades donde cambien el resultado<\u002Fdiv>\n<p style=\"margin:0;font-weight:300;font-size:16px;line-height:1.55;color:#4A4766\">Utilizar tecnología, datos o agentes allí donde modifican realmente cómo funciona el sistema.<\u002Fp><\u002Fdiv><div style=\"border:1px solid #E3E2EB;border-radius:28px;padding:30px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"font-weight:900;font-size:40px;line-height:1;color:#FF4F52\">05 <span style=\"opacity:0.55\">·<\u002Fspan><\u002Fdiv>\n<div style=\"font-weight:900;font-size:20px;line-height:1.25;color:#201C4E\">Medir<\u002Fdiv>\n<p style=\"margin:0;font-weight:300;font-size:16px;line-height:1.55;color:#4A4766\">Establecer una referencia que permita saber si algo ha cambiado.<\u002Fp><\u002Fdiv><div style=\"border:1px solid #E3E2EB;border-radius:28px;padding:30px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"font-weight:900;font-size:40px;line-height:1;color:#FF4F52\">06 <span style=\"opacity:0.55\">·<\u002Fspan><\u002Fdiv>\n<div style=\"font-weight:900;font-size:20px;line-height:1.25;color:#201C4E\">Aprender y escalar<\u002Fdiv>\n<p style=\"margin:0;font-weight:300;font-size:16px;line-height:1.55;color:#4A4766\">Extender lo que demuestra resultado y revisar aquello que no lo hace.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:24px;background:#201C4E;border-radius:32px;padding:clamp(36px,5vw,72px);display:flex;flex-direction:column;gap:22px\">\n<div style=\"display:flex;align-items:center;gap:14px;font-weight:900;font-size:13px;letter-spacing:0.18em;color:#FF4F52\"><span style=\"width:40px;height:1px;background:#FF4F52;opacity:0.6;flex:none\"><\u002Fspan><span>Una idea resume el enfoque<\u002Fspan><\u002Fdiv>\n<p style=\"margin:0;max-width:900px;font-weight:900;font-size:clamp(26px,3.4vw,46px);line-height:1.12;letter-spacing:0.01em;color:#fff;text-wrap:balance\">No empezar por la tecnología. Empezar por el resultado que queremos cambiar.<\u002Fp>\n<\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section id=\"conclusion\" style=\"scroll-margin-top:60px;background:#201C4E;color:#fff;padding:clamp(80px,10vw,140px) 0\"><div style=\"max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,72px);\"><div style=\"display:flex;align-items:center;gap:14px;font-weight:900;font-size:13px;letter-spacing:0.18em;color:#FF4F52\"><span style=\"width:40px;height:1px;background:#FF4F52;opacity:0.6;flex:none\"><\u002Fspan><span>CONCLUSIÓN<\u002Fspan><\u002Fdiv>\n<div style=\"max-width:900px\"><h2 style=\"margin:20px 0 0;font-weight:900;font-size:clamp(32px,4.4vw,58px);line-height:1.04;letter-spacing:0.01em;color:#fff;text-wrap:balance\">Más capacidad no significa automáticamente más impacto.<\u002Fh2><\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(32px,5vw,80px);margin-top:44px\">\n<div style=\"flex:1 1 380px;display:flex;flex-direction:column;gap:14px\"><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:rgba(255,255,255,0.86);text-wrap:pretty\">La Inteligencia Artificial está reduciendo el coste de producir, analizar y automatizar.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:rgba(255,255,255,0.86);text-wrap:pretty\">Eso supone una enorme oportunidad.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:rgba(255,255,255,0.86);text-wrap:pretty\">Pero también desplaza el problema.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:rgba(255,255,255,0.86);text-wrap:pretty\">Cuando hacer se vuelve más fácil, decidir qué hacer, diseñar cómo funciona el trabajo y comprobar qué resultado genera adquieren todavía más importancia.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:rgba(255,255,255,0.86);text-wrap:pretty\">Por eso, las tendencias de 2026 no hablan únicamente de Inteligencia Artificial.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:rgba(255,255,255,0.86);text-wrap:pretty\">Hablan de una transformación más profunda en la forma de organizar las empresas.<\u002Fp><\u002Fdiv>\n<div style=\"flex:1 1 420px;display:flex;flex-direction:column\"><div style=\"display:flex;gap:16px;align-items:baseline;padding:16px 0;border-top:1px solid rgba(255,255,255,0.16)\"><span style=\"width:8px;height:8px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-3px)\"><\u002Fspan><span style=\"font-weight:900;font-size:clamp(17px,1.5vw,20px);line-height:1.35;color:#fff\">De gestionar departamentos a gestionar flujos.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;padding:16px 0;border-top:1px solid rgba(255,255,255,0.16)\"><span style=\"width:8px;height:8px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-3px)\"><\u002Fspan><span style=\"font-weight:900;font-size:clamp(17px,1.5vw,20px);line-height:1.35;color:#fff\">De ejecutar tareas a combinar personas y agentes.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;padding:16px 0;border-top:1px solid rgba(255,255,255,0.16)\"><span style=\"width:8px;height:8px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-3px)\"><\u002Fspan><span style=\"font-weight:900;font-size:clamp(17px,1.5vw,20px);line-height:1.35;color:#fff\">De financiar planes a financiar evidencia.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;padding:16px 0;border-top:1px solid rgba(255,255,255,0.16)\"><span style=\"width:8px;height:8px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-3px)\"><\u002Fspan><span style=\"font-weight:900;font-size:clamp(17px,1.5vw,20px);line-height:1.35;color:#fff\">De consultar datos a incorporarlos en las decisiones.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;padding:16px 0;border-top:1px solid rgba(255,255,255,0.16)\"><span style=\"width:8px;height:8px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-3px)\"><\u002Fspan><span style=\"font-weight:900;font-size:clamp(17px,1.5vw,20px);line-height:1.35;color:#fff\">De ocupar puestos a desarrollar capacidades.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;padding:16px 0;border-top:1px solid rgba(255,255,255,0.16)\"><span style=\"width:8px;height:8px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-3px)\"><\u002Fspan><span style=\"font-weight:900;font-size:clamp(17px,1.5vw,20px);line-height:1.35;color:#fff\">De transformar mediante proyectos a construir organizaciones capaces de transformarse continuamente.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:clamp(56px,7vw,96px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:18px\"><div style=\"background:#2C2A6D;border-radius:32px;padding:clamp(30px,4vw,52px);display:flex;flex-direction:column;gap:18px\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:rgba(255,255,255,0.75)\">La pregunta no es únicamente:<\u002Fdiv>\n<p st
