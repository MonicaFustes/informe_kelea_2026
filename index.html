\"color:rgba(255,255,255,0.78);text-decoration:none;font-weight:900;font-size:11px;letter-spacing:0.16em;padding:8px 0\" style-hover=\"color:#FF4F52\">EVOLUCIONAR<\u002Fa><a href=\"#vision\" style=\"color:rgba(255,255,255,0.78);text-decoration:none;font-weight:900;font-size:11px;letter-spacing:0.16em;padding:8px 0\" style-hover=\"color:#FF4F52\">VISIÓN EJECUTIVA<\u002Fa><a href=\"#empezar\" style=\"color:rgba(255,255,255,0.78);text-decoration:none;font-weight:900;font-size:11px;letter-spacing:0.16em;padding:8px 0\" style-hover=\"color:#FF4F52\">¿POR DÓNDE EMPEZAR?<\u002Fa><a href=\"#conclusion\" style=\"color:rgba(255,255,255,0.78);text-decoration:none;font-weight:900;font-size:11px;letter-spacing:0.16em;padding:8px 0\" style-hover=\"color:#FF4F52\">CONCLUSIÓN<\u002Fa><a href=\"#fuentes\" style=\"color:rgba(255,255,255,0.78);text-decoration:none;font-weight:900;font-size:11px;letter-spacing:0.16em;padding:8px 0\" style-hover=\"color:#FF4F52\">FUENTES<\u002Fa><\u002Fdiv>\n<a href=\"#inicio\" style=\"flex:none;display:flex\"><img src=\"7606ed68-acf8-4a07-a0cf-de67d130c6bb\" alt=\"kelea.\" style=\"height:24px;width:auto;display:block\"><\u002Fa>\n<\u002Fdiv><\u002Fdiv><div style=\"position:absolute;left:0;right:0;bottom:-1px;height:3px;background:#FF4F52;transform-origin:0 50%;animation:kprogress linear both;animation-timeline:scroll(root)\"><\u002Fdiv><\u002Fnav>\n<header id=\"inicio\" style=\"background:#201C4E;color:#fff;overflow:hidden\"><div style=\"max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,72px);\"><div style=\"display:flex;flex-wrap:wrap;gap:40px;align-items:stretch\">\n<div style=\"flex:1 1 560px;padding:clamp(72px,11vw,150px) 0 clamp(64px,8vw,110px)\">\n<div style=\"display:flex;align-items:center;gap:14px;font-weight:900;font-size:13px;letter-spacing:0.18em;color:#FF4F52\"><span style=\"width:40px;height:1px;background:#FF4F52;opacity:0.6;flex:none\"><\u002Fspan><span>Análisis ejecutivo · Octubre 2026<\u002Fspan><\u002Fdiv>\n<h1 style=\"margin:28px 0 0;font-weight:900;font-size:clamp(40px,6.2vw,88px);line-height:1;letter-spacing:0.01em;text-wrap:balance\"><span style=\"color:#FF4F52\">15<\u002Fspan> GRANDES TENDENCIAS DE TRANSFORMACIÓN ORGANIZATIVA<\u002Fh1>\n<p style=\"margin:32px 0 0;max-width:620px;font-weight:300;font-size:clamp(19px,1.8vw,26px);line-height:1.4;color:rgba(255,255,255,0.86);text-wrap:pretty\">De incorporar tecnología a reinventar cómo decidimos, trabajamos, construimos y creamos valor.<\u002Fp>\n<div style=\"margin-top:clamp(40px,6vw,72px);font-weight:900;font-size:clamp(88px,15vw,210px);line-height:0.82;letter-spacing:-0.01em;color:#FF4F52\">2026<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:0 1 340px;min-width:220px;display:flex;align-items:flex-end;padding-top:64px\">\n<div style=\"position:relative;width:100%;height:min(520px,78%);min-height:300px;background:#FF4F52;border-radius:32px 32px 0 0;overflow:hidden\"><img src=\"c8f64b53-369c-4e9b-b660-f838b0fb5186\" alt=\"\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.85;mix-blend-mode:screen\"><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fheader>\n<section id=\"introduccion\" style=\"scroll-margin-top:60px;padding:clamp(72px,9vw,128px) 0\"><div style=\"max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,72px);\"><div style=\"display:flex;align-items:center;gap:14px;font-weight:900;font-size:13px;letter-spacing:0.18em;color:#FF4F52\"><span style=\"width:40px;height:1px;background:#FF4F52;opacity:0.6;flex:none\"><\u002Fspan><span>01 · INTRODUCCIÓN<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(32px,5vw,80px);margin-top:4px\">\n<div style=\"flex:1 1 340px;max-width:480px\"><h2 style=\"margin:20px 0 0;font-weight:900;font-size:clamp(32px,4.4vw,58px);line-height:1.04;letter-spacing:0.01em;color:#201C4E;text-wrap:balance\">La transformación ya no es un proyecto. Es una capacidad.<\u002Fh2><\u002Fdiv>\n<div style=\"flex:1.4 1 420px;display:flex;flex-direction:column;gap:18px;padding-top:24px\"><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">La Inteligencia Artificial ya está entrando en las organizaciones.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Se utiliza para analizar información, generar contenido, automatizar tareas, desarrollar software, mejorar decisiones y crear nuevas experiencias.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Pero adoptar tecnología y transformar una organización no son la misma cosa.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">La diferencia empieza a estar en qué cambia realmente gracias a ella.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Porque disponer de más capacidad para ejecutar no garantiza mejores resultados. Si las prioridades siguen siendo difusas, los procesos mantienen sus fricciones, los equipos trabajan de forma aislada o los datos no llegan a la decisión, la tecnología puede acelerar el trabajo sin transformar el resultado.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Por eso, el reto de 2026 no consiste únicamente en incorporar IA.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Consiste en rediseñar cómo la organización decide, cómo funciona el trabajo, cómo crea nuevas soluciones, cómo convierte los datos en acción y cómo desarrolla las capacidades necesarias para sostener el cambio.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#201C4E;text-wrap:pretty\">La transformación deja así de entenderse como una sucesión de iniciativas y empieza a convertirse en una capacidad permanente de la organización.<\u002Fp><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section style=\"background:#201C4E;color:#fff;padding:clamp(64px,8vw,104px) 0\"><div style=\"max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,72px);\"><div style=\"display:flex;align-items:center;gap:14px;font-weight:900;font-size:13px;letter-spacing:0.18em;color:#FF4F52\"><span style=\"width:40px;height:1px;background:#FF4F52;opacity:0.6;flex:none\"><\u002Fspan><span><\u002Fspan><\u002Fdiv><h2 style=\"margin:20px 0 0;font-weight:900;font-size:clamp(32px,4.4vw,58px);line-height:1.04;letter-spacing:0.01em;color:#fff;text-wrap:balance\">Cuatro señales del cambio<\u002Fh2>\n<div style=\"margin-top:48px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:20px\"><div style=\"background:#2C2A6D;border-radius:28px;padding:32px 28px;display:flex;flex-direction:column;gap:20px\">\n<x-import component-from-global-scope=\"KeleaDesignSystem_dead85.StatCircle\" value=\"88\" unit=\" %\" tone=\"onDark\" hint-size=\"100%,54px\"><\u002Fx-import>\n<p style=\"margin:0;font-weight:300;font-size:17px;line-height:1.5;color:rgba(255,255,255,0.9);flex:1\">de las organizaciones encuestadas utilizan IA en al menos una función.<\u002Fp>\n<div style=\"padding-top:14px;border-top:1px solid rgba(255,255,255,0.16);font-weight:900;font-size:11px;letter-spacing:0.14em;color:rgba(255,255,255,0.7)\">McKinsey · State of AI 2025<\u002Fdiv><\u002Fdiv><div style=\"background:#2C2A6D;border-radius:28px;padding:32px 28px;display:flex;flex-direction:column;gap:20px\">\n<x-import component-from-global-scope=\"KeleaDesignSystem_dead85.StatCircle\" value=\"12\" unit=\" %\" tone=\"onDark\" hint-size=\"100%,54px\"><\u002Fx-import>\n<p style=\"margin:0;font-weight:300;font-size:17px;line-height:1.5;color:rgba(255,255,255,0.9);flex:1\">de los CEO declaran beneficios simultáneos en costes e ingresos derivados de la IA.<\u002Fp>\n<div style=\"padding-top:14px;border-top:1px solid rgba(255,255,255,0.16);font-weight:900;font-size:11px;letter-spacing:0.14em;color:rgba(255,255,255,0.7)\">PwC · CEO Survey 2026<\u002Fdiv><\u002Fdiv><div style=\"background:#2C2A6D;border-radius:28px;padding:32px 28px;display:flex;flex-direction:column;gap:20px\">\n<x-import component-from-global-scope=\"KeleaDesignSystem_dead85.StatCircle\" value=\"39\" unit=\" %\" tone=\"onDark\" hint-size=\"100%,54px\"><\u002Fx-import>\n<p style=\"margin:0;font-weight:300;font-size:17px;line-height:1.5;color:rgba(255,255,255,0.9);flex:1\">de las habilidades laborales podrían transformarse hasta 2030.<\u002Fp>\n<div style=\"padding-top:14px;border-top:1px solid rgba(255,255,255,0.16);font-weight:900;font-size:11px;letter-spacing:0.14em;color:rgba(255,255,255,0.7)\">World Economic Forum · Future of Jobs 2025<\u002Fdiv><\u002Fdiv><div style=\"background:#2C2A6D;border-radius:28px;padding:32px 28px;display:flex;flex-direction:column;gap:20px\">\n<x-import component-from-global-scope=\"KeleaDesignSystem_dead85.StatCircle\" value=\"85\" unit=\" %\" tone=\"onDark\" hint-size=\"100%,54px\"><\u002Fx-import>\n<p style=\"margin:0;font-weight:300;font-size:17px;line-height:1.5;color:rgba(255,255,255,0.9);flex:1\">consideran crítica la adaptabilidad organizativa.<\u002Fp>\n<div style=\"padding-top:14px;border-top:1px solid rgba(255,255,255,0.16);font-weight:900;font-size:11px;letter-spacing:0.14em;color:rgba(255,255,255,0.7)\">Deloitte · Human Capital Trends 2026<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section style=\"padding:clamp(72px,9vw,120px) 0;border-bottom:1px solid #E3E2EB\"><div style=\"max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,72px);\"><div style=\"display:flex;align-items:center;gap:14px;font-weight:900;font-size:13px;letter-spacing:0.18em;color:#FF4F52\"><span style=\"width:40px;height:1px;background:#FF4F52;opacity:0.6;flex:none\"><\u002Fspan><span>La lectura<\u002Fspan><\u002Fdiv>\n<div style=\"margin-top:28px;display:flex;flex-direction:column;gap:18px;max-width:960px\"><p style=\"margin:0;font-weight:900;font-size:clamp(24px,2.9vw,40px);line-height:1.18;letter-spacing:0.01em;color:#201C4E;text-wrap:balance\">La tecnología está avanzando rápido.<\u002Fp><p style=\"margin:0;font-weight:900;font-size:clamp(24px,2.9vw,40px);line-height:1.18;letter-spacing:0.01em;color:#201C4E;text-wrap:balance\">La capacidad de las organizaciones para convertirla en impacto no siempre avanza al mismo ritmo.<\u002Fp><p style=\"margin:0;font-weight:900;font-size:clamp(24px,2.9vw,40px);line-height:1.18;letter-spacing:0.01em;color:#FF4F52;text-wrap:balance\">Y esa distancia explica buena parte de las tendencias que analizamos en este informe.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section id=\"mapa\" style=\"scroll-margin-top:60px;background:#201C4E;color:#fff;padding:clamp(72px,9vw,128px) 0\"><div style=\"max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,72px);\"><div style=\"display:flex;align-items:center;gap:14px;font-weight:900;font-size:13px;letter-spacing:0.18em;color:#FF4F52\"><span style=\"width:40px;height:1px;background:#FF4F52;opacity:0.6;flex:none\"><\u002Fspan><span>02 · MAPA DE TENDENCIAS<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(24px,5vw,80px);align-items:flex-end\">\n<div style=\"flex:1 1 420px;max-width:640px\"><h2 style=\"margin:20px 0 0;font-weight:900;font-size:clamp(32px,4.4vw,58px);line-height:1.04;letter-spacing:0.01em;color:#fff;text-wrap:balance\">Cinco movimientos. Una misma transformación.<\u002Fh2><\u002Fdiv>\n<div style=\"flex:1 1 360px;display:flex;flex-direction:column;gap:12px\"><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:rgba(255,255,255,0.86);text-wrap:pretty\">Las quince tendencias no describen quince fenómenos independientes.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:rgba(255,255,255,0.86);text-wrap:pretty\">Juntas explican cómo está cambiando el sistema con el que las organizaciones convierten estrategia, personas, tecnología y datos en resultados.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:56px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,196px),1fr));gap:16px\"><div style=\"background:#2C2A6D;border-radius:28px;padding:28px 24px;display:flex;flex-direction:column\">\n<a href=\"#bloque-1\" style=\"text-decoration:none;font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\" style-hover=\"color:#fff\">01 · DECIDIR<\u002Fa>\n<p style=\"margin:14px 0 18px;font-weight:300;font-size:15px;line-height:1.5;color:rgba(255,255,255,0.88);text-wrap:pretty\">De gestionar actividad a orientar capacidad hacia resultados.<\u002Fp>\n<div style=\"display:flex;flex-direction:column;margin-top:auto\"><a href=\"#tendencia-01\" style=\"display:block;text-decoration:none;color:#fff;padding:14px 0;border-top:1px solid rgba(255,255,255,0.14)\" style-hover=\"color:#FF4F52\"><div style=\"font-weight:900;font-size:15px;line-height:1.3\">01 · La organización AI-native<\u002Fdiv><div style=\"margin-top:6px;font-weight:300;font-size:13.5px;line-height:1.45;color:rgba(255,255,255,0.78)\">La IA empieza a condicionar el diseño del trabajo, los roles y la asignación de recursos.<\u002Fdiv><\u002Fa><a href=\"#tendencia-02\" style=\"display:block;text-decoration:none;color:#fff;padding:14px 0;border-top:1px solid rgba(255,255,255,0.14)\" style-hover=\"color:#FF4F52\"><div style=\"font-weight:900;font-size:15px;line-height:1.3\">02 · De funciones a flujos de valor<\u002Fdiv><div style=\"margin-top:6px;font-weight:300;font-size:13.5px;line-height:1.45;color:rgba(255,255,255,0.78)\">La responsabilidad se extiende desde las funciones hacia resultados de extremo a extremo.<\u002Fdiv><\u002Fa><a href=\"#tendencia-03\" style=\"display:block;text-decoration:none;color:#fff;padding:14px 0;border-top:1px solid rgba(255,255,255,0.14)\" style-hover=\"color:#FF4F52\"><div style=\"font-weight:900;font-size:15px;line-height:1.3\">03 · La transformación continua<\u002Fdiv><div style=\"margin-top:6px;font-weight:300;font-size:13.5px;line-height:1.45;color:rgba(255,255,255,0.78)\">Cambiar deja de ser excepcional y pasa a formar parte del funcionamiento habitual.<\u002Fdiv><\u002Fa><a href=\"#tendencia-04\" style=\"display:block;text-decoration:none;color:#fff;padding:14px 0;border-top:1px solid rgba(255,255,255,0.14)\" style-hover=\"color:#FF4F52\"><div style=\"font-weight:900;font-size:15px;line-height:1.3\">04 · Finanzas orientadas al valor<\u002Fdiv><div style=\"margin-top:6px;font-weight:300;font-size:13.5px;line-height:1.45;color:rgba(255,255,255,0.78)\">La inversión empieza a seguir la evidencia y los resultados, no únicamente los planes.<\u002Fdiv><\u002Fa><\u002Fdiv><\u002Fdiv><div style=\"background:#2C2A6D;border-radius:28px;padding:28px 24px;display:flex;flex-direction:column\">\n<a href=\"#bloque-2\" style=\"text-decoration:none;font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\" style-hover=\"color:#fff\">02 · REDISEÑAR<\u002Fa>\n<p style=\"margin:14px 0 18px;font-weight:300;font-size:15px;line-height:1.5;color:rgba(255,255,255,0.88);text-wrap:pretty\">De aplicar IA al trabajo existente a replantear cómo se realiza.<\u002Fp>\n<div style=\"display:flex;flex-direction:column;margin-top:auto\"><a href=\"#tendencia-05\" style=\"display:block;text-decoration:none;color:#fff;padding:14px 0;border-top:1px solid rgba(255,255,255,0.14)\" style-hover=\"color:#FF4F52\"><div style=\"font-weight:900;font-size:15px;line-height:1.3\">05 · La empresa agéntica<\u002Fdiv><div style=\"margin-top:6px;font-weight:300;font-size:13.5px;line-height:1.45;color:rgba(255,255,255,0.78)\">Los agentes empiezan a ejecutar secuencias de trabajo bajo reglas y supervisión.<\u002Fdiv><\u002Fa><a href=\"#tendencia-06\" style=\"display:block;text-decoration:none;color:#fff;padding:14px 0;border-top:1px solid rgba(255,255,255,0.14)\" style-hover=\"color:#FF4F52\"><div style=\"font-weight:900;font-size:15px;line-height:1.3\">06 · Liderazgo aumentado por IA<\u002Fdiv><div style=\"margin-top:6px;font-weight:300;font-size:13.5px;line-height:1.45;color:rgba(255,255,255,0.78)\">La capacidad de analizar crece y aumenta la importancia del juicio y los derechos de decisión.<\u002Fdiv><\u002Fa><a href=\"#tendencia-07\" style=\"display:block;text-decoration:none;color:#fff;padding:14px 0;border-top:1px solid rgba(255,255,255,0.14)\" style-hover=\"color:#FF4F52\"><div style=\"font-weight:900;font-size:15px;line-height:1.3\">07 · Equipos pequeños de gran capacidad<\u002Fdiv><div style=\"margin-top:6px;font-weight:300;font-size:13.5px;line-height:1.45;color:rgba(255,255,255,0.78)\">La IA amplifica el alcance de equipos multidisciplinares y modifica dónde aportan valor las personas.<\u002Fdiv><\u002Fa><\u002Fdiv><\u002Fdiv><div style=\"background:#2C2A6D;border-radius:28px;padding:28px 24px;display:flex;flex-direction:column\">\n<a href=\"#bloque-3\" style=\"text-decoration:none;font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\" style-hover=\"color:#fff\">03 · CONSTRUIR<\u002Fa>\n<p style=\"margin:14px 0 18px;font-weight:300;font-size:15px;line-height:1.5;color:rgba(255,255,255,0.88);text-wrap:pretty\">De utilizar IA para ser más eficientes a utilizarla para crear nuevo valor.<\u002Fp>\n<div style=\"display:flex;flex-direction:column;margin-top:auto\"><a href=\"#tendencia-08\" style=\"display:block;text-decoration:none;color:#fff;padding:14px 0;border-top:1px solid rgba(255,255,255,0.14)\" style-hover=\"color:#FF4F52\"><div style=\"font-weight:900;font-size:15px;line-height:1.3\">08 · Innovación y productos AI-native<\u002Fdiv><div style=\"margin-top:6px;font-weight:300;font-size:13.5px;line-height:1.45;color:rgba(255,255,255,0.78)\">Aparecen productos y servicios cuyo valor depende de capacidades inteligentes.<\u002Fdiv><\u002Fa><a href=\"#tendencia-09\" style=\"display:block;text-decoration:none;color:#fff;padding:14px 0;border-top:1px solid rgba(255,255,255,0.14)\" style-hover=\"color:#FF4F52\"><div style=\"font-weight:900;font-size:15px;line-height:1.3\">09 · Experiencia de cliente agéntica<\u002Fdiv><div style=\"margin-top:6px;font-weight:300;font-size:13.5px;line-height:1.45;color:rgba(255,255,255,0.78)\">Los agentes empiezan a intermediar en la relación entre clientes y organizaciones.<\u002Fdiv><\u002Fa><a href=\"#tendencia-10\" style=\"display:block;text-decoration:none;color:#fff;padding:14px 0;border-top:1px solid rgba(255,255,255,0.14)\" style-hover=\"color:#FF4F52\"><div style=\"font-weight:900;font-size:15px;line-height:1.3\">10 · Tecnología componible y soberana<\u002Fdiv><div style=\"margin-top:6px;font-weight:300;font-size:13.5px;line-height:1.45;color:rgba(255,255,255,0.78)\">La capacidad de integrar y cambiar tecnología se convierte en una condición de adaptabilidad.<\u002Fdiv><\u002Fa><\u002Fdiv><\u002Fdiv><div style=\"background:#2C2A6D;border-radius:28px;padding:28px 24px;display:flex;flex-direction:column\">\n<a href=\"#bloque-4\" style=\"text-decoration:none;font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\" style-hover=\"color:#fff\">04 · OPERAR CON DATOS<\u002Fa>\n<p style=\"margin:14px 0 18px;font-weight:300;font-size:15px;line-height:1.5;color:rgba(255,255,255,0.88);text-wrap:pretty\">De observar lo que ocurre a utilizar datos e inteligencia dentro de la propia operación.<\u002Fp>\n<div style=\"display:flex;flex-direction:column;margin-top:auto\"><a href=\"#tendencia-11\" style=\"display:block;text-decoration:none;color:#fff;padding:14px 0;border-top:1px solid rgba(255,255,255,0.14)\" style-hover=\"color:#FF4F52\"><div style=\"font-weight:900;font-size:15px;line-height:1.3\">11 · Sistemas inteligentes de decisión<\u002Fdiv><div style=\"margin-top:6px;font-weight:300;font-size:13.5px;line-height:1.45;color:rgba(255,255,255,0.78)\">La analítica empieza a predecir, recomendar y activar acciones.<\u002Fdiv><\u002Fa><a href=\"#tendencia-12\" style=\"display:block;text-decoration:none;color:#fff;padding:14px 0;border-top:1px solid rgba(255,255,255,0.14)\" style-hover=\"color:#FF4F52\"><div style=\"font-weight:900;font-size:15px;line-height:1.3\">12 · Gobernanza y ciberresiliencia<\u002Fdiv><div style=\"margin-top:6px;font-weight:300;font-size:13.5px;line-height:1.45;color:rgba(255,255,255,0.78)\">La autonomía de los sistemas exige más trazabilidad, permisos y control.<\u002Fdiv><\u002Fa><a href=\"#tendencia-13\" style=\"display:block;text-decoration:none;color:#fff;padding:14px 0;border-top:1px solid rgba(255,255,255,0.14)\" style-hover=\"color:#FF4F52\"><div style=\"font-weight:900;font-size:15px;line-height:1.3\">13 · Resiliencia y sostenibilidad estratégica<\u002Fdiv><div style=\"margin-top:6px;font-weight:300;font-size:13.5px;line-height:1.45;color:rgba(255,255,255,0.78)\">Datos y escenarios empiezan a conectar continuidad, coste y sostenibilidad.<\u002Fdiv><\u002Fa><\u002Fdiv><\u002Fdiv><div style=\"background:#2C2A6D;border-radius:28px;padding:28px 24px;display:flex;flex-direction:column\">\n<a href=\"#bloque-5\" style=\"text-decoration:none;font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\" style-hover=\"color:#fff\">05 · EVOLUCIONAR<\u002Fa>\n<p style=\"margin:14px 0 18px;font-weight:300;font-size:15px;line-height:1.5;color:rgba(255,255,255,0.88);text-wrap:pretty\">De preparar personas para un puesto a desarrollar capacidad permanente de adaptación.<\u002Fp>\n<div style=\"display:flex;flex-direction:column;margin-top:auto\"><a href=\"#tendencia-14\" style=\"display:block;text-decoration:none;color:#fff;padding:14px 0;border-top:1px solid rgba(255,255,255,0.14)\" style-hover=\"color:#FF4F52\"><div style=\"font-weight:900;font-size:15px;line-height:1.3\">14 · Talento basado en habilidades<\u002Fdiv><div style=\"margin-top:6px;font-weight:300;font-size:13.5px;line-height:1.45;color:rgba(255,255,255,0.78)\">Las capacidades actualizables ganan peso frente a los roles rígidos.<\u002Fdiv><\u002Fa><a href=\"#tendencia-15\" style=\"display:block;text-decoration:none;color:#fff;padding:14px 0;border-top:1px solid rgba(255,255,255,0.14)\" style-hover=\"color:#FF4F52\"><div style=\"font-weight:900;font-size:15px;line-height:1.3\">15 · Cultura de aprendizaje y confianza<\u002Fdiv><div style=\"margin-top:6px;font-weight:300;font-size:13.5px;line-height:1.45;color:rgba(255,255,255,0.78)\">Aprender, experimentar y cuestionar se convierten en capacidades estratégicas.<\u002Fdiv><\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section id=\"bloque-1\" style=\"scroll-margin-top:60px;background:#201C4E;color:#fff;padding:clamp(80px,10vw,140px) 0 clamp(72px,9vw,120px)\"><div style=\"max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,72px);\">\n<div style=\"font-weight:900;font-size:clamp(64px,9vw,128px);line-height:0.9;color:#FF4F52\"><span style=\"opacity:0.55\">/<\u002Fspan>01<\u002Fdiv>\n<div style=\"margin-top:28px\"><div style=\"display:flex;align-items:center;gap:14px;font-weight:900;font-size:13px;letter-spacing:0.18em;color:#fff\"><span style=\"width:40px;height:1px;background:#fff;opacity:0.6;flex:none\"><\u002Fspan><span>BLOQUE 01 · DECIDIR<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(32px,5vw,80px)\">\n<div style=\"flex:1 1 420px;max-width:620px\"><h2 style=\"margin:20px 0 0;font-weight:900;font-size:clamp(32px,4.4vw,58px);line-height:1.04;letter-spacing:0.01em;color:#fff;text-wrap:balance\">Más capacidad para hacer exige más criterio para elegir.<\u002Fh2><\u002Fdiv>\n<div style=\"flex:1 1 380px;display:flex;flex-direction:column;gap:16px;padding-top:26px\"><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:rgba(255,255,255,0.86);text-wrap:pretty\">Durante años, una parte importante de la transformación se ha centrado en aumentar la capacidad de ejecución.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:rgba(255,255,255,0.86);text-wrap:pretty\">Más tecnología.<br>Más automatización.<br>Más iniciativas.<br>Más velocidad.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:rgba(255,255,255,0.86);text-wrap:pretty\">La IA acelera todavía más esa dinámica.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:rgba(255,255,255,0.86);text-wrap:pretty\">Pero cuanto más sencillo resulta producir, analizar o automatizar, mayor importancia adquiere decidir qué merece la pena hacer, qué resultado perseguimos y dónde concentramos los recursos disponibles.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:rgba(255,255,255,0.86);text-wrap:pretty\">La transformación empieza, por tanto, antes de la ejecución.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:rgba(255,255,255,0.86);text-wrap:pretty\">Empieza en cómo se toman decisiones.<\u002Fp><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section style=\"background:#fff\"><div style=\"max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,72px);\"><article id=\"tendencia-01\" style=\"scroll-margin-top:60px;padding:clamp(56px,7vw,96px) 0;border-top:none\">\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(28px,5vw,80px)\">\n<div style=\"flex:1 1 340px;max-width:470px\">\n<div style=\"display:flex;align-items:center;gap:14px;font-weight:900;font-size:13px;letter-spacing:0.18em;color:#FF4F52\"><span style=\"width:40px;height:1px;background:#FF4F52;opacity:0.6;flex:none\"><\u002Fspan><span>TENDENCIA 01<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin:18px 0 0;font-weight:900;font-size:clamp(30px,3.4vw,46px);line-height:1.06;letter-spacing:0.01em;color:#201C4E;text-wrap:balance\">La organización AI-native<\u002Fh3>\n<p style=\"margin:22px 0 0;padding-left:18px;border-left:3px solid #FF4F52;font-weight:300;font-style:italic;font-size:clamp(18px,1.6vw,22px);line-height:1.4;color:#201C4E;text-wrap:pretty\">La IA deja de añadirse al trabajo y empieza a modificar cómo se diseña.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1.3 1 400px;display:flex;flex-direction:column;gap:14px;padding-top:6px\"><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">La primera etapa de adopción de IA se ha desarrollado principalmente sobre estructuras ya existentes.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Mismos equipos.<br>Mismos roles.<br>Mismos procesos.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Con nuevas herramientas.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Pero la capacidad adicional que aporta la IA empieza a cuestionar ese diseño.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Cuando una parte del trabajo puede ser generada, analizada o ejecutada de otra manera, también cambian la composición de los equipos, las responsabilidades y la forma de asignar recursos.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">La organización AI-native no se define por la cantidad de tecnología que utiliza.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Se define por su capacidad para replantear cómo organiza el trabajo alrededor de esas nuevas capacidades.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:clamp(36px,4vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;align-items:stretch\">\n<div style=\"background:#F2F1F6;border-radius:28px;padding:30px 30px 22px\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Qué cambia<\u002Fdiv>\n<ul style=\"list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column\"><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Los roles empiezan a redefinirse alrededor del resultado.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Las interfaces entre personas y agentes necesitan ser explícitas.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>La capacidad deja de medirse únicamente por número de personas.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Las responsabilidades sobre las decisiones y los resultados necesitan mayor claridad.<\u002Fspan><\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div style=\"border:1px solid #E3E2EB;border-radius:28px;padding:30px;display:flex;flex-direction:column\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Ejemplo<\u002Fdiv>\n<div style=\"margin-top:16px;display:flex;flex-direction:column;gap:10px\"><p style=\"margin:0;font-weight:300;font-size:clamp(18px,1.5vw,21px);line-height:1.5;color:#201C4E;text-wrap:pretty\">Una organización aumenta su capacidad para gestionar operaciones sin incrementar proporcionalmente su estructura administrativa.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#201C4E;border-radius:28px;padding:30px;display:flex;flex-direction:column\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Pregunta para la organización<\u002Fdiv>\n<div style=\"margin-top:16px\"><p style=\"margin:0;font-weight:900;font-size:clamp(20px,1.8vw,24px);line-height:1.3;color:#fff;text-wrap:pretty\"><strong style=\"font-weight:900\">Si hoy diseñásemos el trabajo desde cero, ¿lo repartiríamos de la misma manera?<\u002Fstrong><\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:22px 0 0;font-weight:300;font-size:14px;line-height:1.5;color:#4A4766\"><strong style=\"font-weight:900\">Fuentes: <\u002Fstrong>Deloitte Human Capital Trends; Microsoft Work Trend Index.<\u002Fp>\n<\u002Farticle><article id=\"tendencia-02\" style=\"scroll-margin-top:60px;padding:clamp(56px,7vw,96px) 0;border-top:1px solid #E3E2EB\">\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(28px,5vw,80px)\">\n<div style=\"flex:1 1 340px;max-width:470px\">\n<div style=\"display:flex;align-items:center;gap:14px;font-weight:900;font-size:13px;letter-spacing:0.18em;color:#FF4F52\"><span style=\"width:40px;height:1px;background:#FF4F52;opacity:0.6;flex:none\"><\u002Fspan><span>TENDENCIA 02<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin:18px 0 0;font-weight:900;font-size:clamp(30px,3.4vw,46px);line-height:1.06;letter-spacing:0.01em;color:#201C4E;text-wrap:balance\">De funciones a flujos de valor<\u002Fh3>\n<p style=\"margin:22px 0 0;padding-left:18px;border-left:3px solid #FF4F52;font-weight:300;font-style:italic;font-size:clamp(18px,1.6vw,22px);line-height:1.4;color:#201C4E;text-wrap:pretty\">Optimizar cada parte no garantiza optimizar el resultado.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1.3 1 400px;display:flex;flex-direction:column;gap:14px;padding-top:6px\"><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Las organizaciones necesitan especialización.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Pero los resultados que importan rara vez pertenecen a una única función.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Dar de alta un cliente, lanzar un producto, resolver una incidencia o completar un pedido atraviesa equipos, sistemas y decisiones diferentes.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Cuando cada parte optimiza únicamente su actividad aparecen esperas, dependencias, traspasos y objetivos contradictorios.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Por eso, junto al organigrama funcional, empieza a ganar relevancia otra perspectiva:<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">el flujo completo mediante el que se genera un resultado.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:clamp(36px,4vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;align-items:stretch\">\n<div style=\"background:#F2F1F6;border-radius:28px;padding:30px 30px 22px\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Qué cambia<\u002Fdiv>\n<ul style=\"list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column\"><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Identificar journeys y flujos prioritarios.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Compartir objetivos y métricas.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Asignar responsabilidad sobre el resultado end-to-end.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Revisar traspasos y dependencias.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Clarificar quién puede decidir qué.<\u002Fspan><\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div style=\"border:1px solid #E3E2EB;border-radius:28px;padding:30px;display:flex;flex-direction:column\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Ejemplo<\u002Fdiv>\n<div style=\"margin-top:16px;display:flex;flex-direction:column;gap:10px\"><p style=\"margin:0;font-weight:300;font-size:clamp(18px,1.5vw,21px);line-height:1.5;color:#201C4E;text-wrap:pretty\">Un equipo integrado gestiona el alta de un cliente desde la captación hasta la activación.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#201C4E;border-radius:28px;padding:30px;display:flex;flex-direction:column\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Pregunta para la organización<\u002Fdiv>\n<div style=\"margin-top:16px\"><p style=\"margin:0;font-weight:900;font-size:clamp(20px,1.8vw,24px);line-height:1.3;color:#fff;text-wrap:pretty\"><strong style=\"font-weight:900\">¿Estamos optimizando departamentos o el resultado que atraviesa esos departamentos?<\u002Fstrong><\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:22px 0 0;font-weight:300;font-size:14px;line-height:1.5;color:#4A4766\"><strong style=\"font-weight:900\">Fuentes: <\u002Fstrong>McKinsey State of AI; literatura sobre operating models.<\u002Fp>\n<\u002Farticle><article id=\"tendencia-03\" style=\"scroll-margin-top:60px;padding:clamp(56px,7vw,96px) 0;border-top:1px solid #E3E2EB\">\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(28px,5vw,80px)\">\n<div style=\"flex:1 1 340px;max-width:470px\">\n<div style=\"display:flex;align-items:center;gap:14px;font-weight:900;font-size:13px;letter-spacing:0.18em;color:#FF4F52\"><span style=\"width:40px;height:1px;background:#FF4F52;opacity:0.6;flex:none\"><\u002Fspan><span>TENDENCIA 03<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin:18px 0 0;font-weight:900;font-size:clamp(30px,3.4vw,46px);line-height:1.06;letter-spacing:0.01em;color:#201C4E;text-wrap:balance\">La transformación continua<\u002Fh3>\n<p style=\"margin:22px 0 0;padding-left:18px;border-left:3px solid #FF4F52;font-weight:300;font-style:italic;font-size:clamp(18px,1.6vw,22px);line-height:1.4;color:#201C4E;text-wrap:pretty\">Cambiar deja de ser una excepción.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1.3 1 400px;display:flex;flex-direction:column;gap:14px;padding-top:6px\"><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">La transformación tradicional tiene principio y final.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Se define un programa.<br>Se establece un roadmap.<br>Se ejecutan iniciativas.<br>Se cierra.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">El problema aparece cuando el contexto cambia antes de que termine el propio programa.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Por eso, las organizaciones empiezan a convertir la transformación en un sistema continuo de observación, priorización, ejecución, aprendizaje y reasignación.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">El cambio deja de estar separado del negocio.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Pasa a formar parte de cómo se gestiona.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:clamp(36px,4vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;align-items:stretch\">\n<div style=\"background:#F2F1F6;border-radius:28px;padding:30px 30px 22px\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Qué cambia<\u002Fdiv>\n<ul style=\"list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column\"><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Las prioridades se revisan con mayor frecuencia.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>La evidencia pesa más que el plan inicial.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Las oportunidades se gestionan como una cartera viva.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Los recursos pueden reasignarse cuando cambia el retorno esperado.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>La transformación se conecta de forma más directa con la gestión del negocio.<\u002Fspan><\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div style=\"border:1px solid #E3E2EB;border-radius:28px;padding:30px;display:flex;flex-direction:column\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Ejemplo<\u002Fdiv>\n<div style=\"margin-top:16px;display:flex;flex-direction:column;gap:10px\"><p style=\"margin:0;font-weight:300;font-size:clamp(18px,1.5vw,21px);line-height:1.5;color:#201C4E;text-wrap:pretty\">Una organización revisa periódicamente oportunidades, obstáculos y retornos utilizando información operativa real.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#201C4E;border-radius:28px;padding:30px;display:flex;flex-direction:column\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Pregunta para la organización<\u002Fdiv>\n<div style=\"margin-top:16px\"><p style=\"margin:0;font-weight:900;font-size:clamp(20px,1.8vw,24px);line-height:1.3;color:#fff;text-wrap:pretty\"><strong style=\"font-weight:900\">¿Podemos cambiar una prioridad importante sin tener que lanzar otro programa de transformación?<\u002Fstrong><\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:22px 0 0;font-weight:300;font-size:14px;line-height:1.5;color:#4A4766\"><strong style=\"font-weight:900\">Fuentes: <\u002Fstrong>Deloitte Human Capital Trends 2026; BCG.<\u002Fp>\n<\u002Farticle><article id=\"tendencia-04\" style=\"scroll-margin-top:60px;padding:clamp(56px,7vw,96px) 0;border-top:1px solid #E3E2EB\">\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(28px,5vw,80px)\">\n<div style=\"flex:1 1 340px;max-width:470px\">\n<div style=\"display:flex;align-items:center;gap:14px;font-weight:900;font-size:13px;letter-spacing:0.18em;color:#FF4F52\"><span style=\"width:40px;height:1px;background:#FF4F52;opacity:0.6;flex:none\"><\u002Fspan><span>TENDENCIA 04<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin:18px 0 0;font-weight:900;font-size:clamp(30px,3.4vw,46px);line-height:1.06;letter-spacing:0.01em;color:#201C4E;text-wrap:balance\">Finanzas orientadas al valor<\u002Fh3>\n<p style=\"margin:22px 0 0;padding-left:18px;border-left:3px solid #FF4F52;font-weight:300;font-style:italic;font-size:clamp(18px,1.6vw,22px);line-height:1.4;color:#201C4E;text-wrap:pretty\">Medir actividad empieza a ser insuficiente.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1.3 1 400px;display:flex;flex-direction:column;gap:14px;padding-top:6px\"><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Proyectos ejecutados.<br>Releases.<br>Automatizaciones.<br>Casos de uso.<br>Horas ahorradas.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Todos ellos permiten entender actividad.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Pero no necesariamente valor.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">La presión aumenta para conectar las inversiones de transformación con resultados verificables en margen, ingresos, capital, riesgo o eficiencia.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Esto introduce otra forma de entender la financiación:<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">la inversión deja de depender únicamente de lo que prometemos conseguir y empieza a depender también de lo que vamos demostrando.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:clamp(36px,4vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;align-items:stretch\">\n<div style=\"background:#F2F1F6;border-radius:28px;padding:30px 30px 22px\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Qué cambia<\u002Fdiv>\n<ul style=\"list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column\"><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Definir resultados desde el inicio.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Conectar métricas operativas y económicas.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Revisar periódicamente el retorno.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Reasignar recursos.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Diferenciar claramente output y outcome.<\u002Fspan><\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div style=\"border:1px solid #E3E2EB;border-radius:28px;padding:30px;display:flex;flex-direction:column\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Ejemplo<\u002Fdiv>\n<div style=\"margin-top:16px;display:flex;flex-direction:column;gap:10px\"><p style=\"margin:0;font-weight:300;font-size:clamp(18px,1.5vw,21px);line-height:1.5;color:#201C4E;text-wrap:pretty\">Una cartera de iniciativas se revisa periódicamente y la inversión se concentra en aquellas que demuestran mayor impacto.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#201C4E;border-radius:28px;padding:30px;display:flex;flex-direction:column\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Pregunta para la organización<\u002Fdiv>\n<div style=\"margin-top:16px\"><p style=\"margin:0;font-weight:900;font-size:clamp(20px,1.8vw,24px);line-height:1.3;color:#fff;text-wrap:pretty\"><strong style=\"font-weight:900\">¿Podemos explicar qué ha cambiado gracias a cada inversión de transformación?<\u002Fstrong><\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:22px 0 0;font-weight:300;font-size:14px;line-height:1.5;color:#4A4766\"><strong style=\"font-weight:900\">Fuentes: <\u002Fstrong>IBM CFO Study 2026; PwC.<\u002Fp>\n<\u002Farticle><\u002Fdiv><\u002Fsection>\n<section id=\"bloque-2\" style=\"scroll-margin-top:60px;background:#201C4E;color:#fff;padding:clamp(80px,10vw,140px) 0 clamp(72px,9vw,120px)\"><div style=\"max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,72px);\">\n<div style=\"font-weight:900;font-size:clamp(64px,9vw,128px);line-height:0.9;color:#FF4F52\"><span style=\"opacity:0.55\">/<\u002Fspan>02<\u002Fdiv>\n<div style=\"margin-top:28px\"><div style=\"display:flex;align-items:center;gap:14px;font-weight:900;font-size:13px;letter-spacing:0.18em;color:#fff\"><span style=\"width:40px;height:1px;background:#fff;opacity:0.6;flex:none\"><\u002Fspan><span>BLOQUE 02 · REDISEÑAR<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(32px,5vw,80px)\">\n<div style=\"flex:1 1 420px;max-width:620px\"><h2 style=\"margin:20px 0 0;font-weight:900;font-size:clamp(32px,4.4vw,58px);line-height:1.04;letter-spacing:0.01em;color:#fff;text-wrap:balance\">La verdadera oportunidad no está en acelerar el trabajo de siempre.<\u002Fh2><\u002Fdiv>\n<div style=\"flex:1 1 380px;display:flex;flex-direction:column;gap:16px;padding-top:26px\"><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:rgba(255,255,255,0.86);text-wrap:pretty\">La IA puede hacer una tarea más rápida.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:rgba(255,255,255,0.86);text-wrap:pretty\">Puede resumir.<br>Generar.<br>Buscar.<br>Clasificar.<br>Programar.<br>Recomendar.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:rgba(255,255,255,0.86);text-wrap:pretty\">Pero acelerar cada tarea por separado no garantiza que el conjunto funcione mejor.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:rgba(255,255,255,0.86);text-wrap:pretty\">El siguiente salto aparece cuando las organizaciones empiezan a preguntarse:<\u002Fp><p style=\"margin:8px 0 0;font-weight:900;font-size:clamp(20px,1.9vw,26px);line-height:1.3;color:#fff;text-wrap:pretty\"><strong style=\"font-weight:900\">Si ahora tenemos capacidades que antes no existían, ¿deberíamos seguir realizando el trabajo de la misma manera?<\u002Fstrong><\u002Fp><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section style=\"background:#fff\"><div style=\"max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,72px);\"><article id=\"tendencia-05\" style=\"scroll-margin-top:60px;padding:clamp(56px,7vw,96px) 0;border-top:none\">\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(28px,5vw,80px)\">\n<div style=\"flex:1 1 340px;max-width:470px\">\n<div style=\"display:flex;align-items:center;gap:14px;font-weight:900;font-size:13px;letter-spacing:0.18em;color:#FF4F52\"><span style=\"width:40px;height:1px;background:#FF4F52;opacity:0.6;flex:none\"><\u002Fspan><span>TENDENCIA 05<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin:18px 0 0;font-weight:900;font-size:clamp(30px,3.4vw,46px);line-height:1.06;letter-spacing:0.01em;color:#201C4E;text-wrap:balance\">La empresa agéntica<\u002Fh3>\n<p style=\"margin:22px 0 0;padding-left:18px;border-left:3px solid #FF4F52;font-weight:300;font-style:italic;font-size:clamp(18px,1.6vw,22px);line-height:1.4;color:#201C4E;text-wrap:pretty\">Los sistemas empiezan a ejecutar, no únicamente a asistir.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1.3 1 400px;display:flex;flex-direction:column;gap:14px;padding-top:6px\"><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">La IA generativa popularizó modelos que responden a preguntas.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Los agentes amplían esa lógica.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Pueden recibir un objetivo, utilizar aplicaciones y datos y ejecutar una secuencia de acciones bajo políticas previamente definidas.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Eso introduce una nueva capa de capacidad dentro de la organización.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Y también nuevas decisiones de diseño.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:clamp(36px,4vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;align-items:stretch\">\n<div style=\"background:#F2F1F6;border-radius:28px;padding:30px 30px 22px\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Qué cambia<\u002Fdiv>\n<ul style=\"list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column\"><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Qué trabajo puede delegarse.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Qué reglas necesita cada proceso.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Qué límites tiene cada agente.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Dónde es necesaria supervisión humana.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Cómo se verifica lo que ha ocurrido.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Cómo se mide el retorno.<\u002Fspan><\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div style=\"border:1px solid #E3E2EB;border-radius:28px;padding:30px;display:flex;flex-direction:column\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Ejemplo<\u002Fdiv>\n<div style=\"margin-top:16px;display:flex;flex-direction:column;gap:10px\"><p style=\"margin:0;font-weight:300;font-size:clamp(18px,1.5vw,21px);line-height:1.5;color:#201C4E;text-wrap:pretty\">Agentes comparan ofertas, validan condiciones y preparan pedidos para autorización.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#201C4E;border-radius:28px;padding:30px;display:flex;flex-direction:column\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Pregunta para la organización<\u002Fdiv>\n<div style=\"margin-top:16px\"><p style=\"margin:0;font-weight:900;font-size:clamp(20px,1.8vw,24px);line-height:1.3;color:#fff;text-wrap:pretty\"><strong style=\"font-weight:900\">¿Qué parte del trabajo puede ejecutar un sistema y dónde seguimos necesitando criterio humano?<\u002Fstrong><\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:22px 0 0;font-weight:300;font-size:14px;line-height:1.5;color:#4A4766\"><strong style=\"font-weight:900\">Fuentes: <\u002Fstrong>Gartner Top Strategic Technology Trends 2026; BCG.<\u002Fp>\n<\u002Farticle><article id=\"tendencia-06\" style=\"scroll-margin-top:60px;padding:clamp(56px,7vw,96px) 0;border-top:1px solid #E3E2EB\">\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(28px,5vw,80px)\">\n<div style=\"flex:1 1 340px;max-width:470px\">\n<div style=\"display:flex;align-items:center;gap:14px;font-weight:900;font-size:13px;letter-spacing:0.18em;color:#FF4F52\"><span style=\"width:40px;height:1px;background:#FF4F52;opacity:0.6;flex:none\"><\u002Fspan><span>TENDENCIA 06<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin:18px 0 0;font-weight:900;font-size:clamp(30px,3.4vw,46px);line-height:1.06;letter-spacing:0.01em;color:#201C4E;text-wrap:balance\">Liderazgo aumentado por IA<\u002Fh3>\n<p style=\"margin:22px 0 0;padding-left:18px;border-left:3px solid #FF4F52;font-weight:300;font-style:italic;font-size:clamp(18px,1.6vw,22px);line-height:1.4;color:#201C4E;text-wrap:pretty\">Cuando generar respuestas se vuelve fácil, aumenta el valor de saber decidir.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1.3 1 400px;display:flex;flex-direction:column;gap:14px;padding-top:6px\"><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Los líderes disponen de nuevas capacidades para analizar información, explorar escenarios y cuestionar hipótesis.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Esto puede reducir enormemente el tiempo necesario para comprender una situación.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Pero no elimina la responsabilidad de decidir.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Al contrario.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Cuantas más opciones puede generar un sistema, más importante se vuelve saber qué pregunta formular, qué evidencia aceptar y qué decisión asumir.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:clamp(36px,4vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;align-items:stretch\">\n<div style=\"background:#F2F1F6;border-radius:28px;padding:30px 30px 22px\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Qué cambia<\u002Fdiv>\n<ul style=\"list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column\"><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Mayor capacidad para analizar escenarios.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Más explicitud en los criterios de decisión.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Derechos de decisión más claros.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Responsabilidad humana en decisiones críticas.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Mayor relevancia del juicio frente a la producción de información.<\u002Fspan><\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div style=\"border:1px solid #E3E2EB;border-radius:28px;padding:30px;display:flex;flex-direction:column\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Ejemplo<\u002Fdiv>\n<div style=\"margin-top:16px;display:flex;flex-direction:column;gap:10px\"><p style=\"margin:0;font-weight:300;font-size:clamp(18px,1.5vw,21px);line-height:1.5;color:#201C4E;text-wrap:pretty\">Un comité utiliza modelos y agentes para contrastar escenarios antes de tomar una decisión de inversión.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#201C4E;border-radius:28px;padding:30px;display:flex;flex-direction:column\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Pregunta para la organización<\u002Fdiv>\n<div style=\"margin-top:16px\"><p style=\"margin:0;font-weight:900;font-size:clamp(20px,1.8vw,24px);line-height:1.3;color:#fff;text-wrap:pretty\"><strong style=\"font-weight:900\">Si podemos generar más alternativas en menos tiempo, ¿tenemos mejores criterios para elegir entre ellas?<\u002Fstrong><\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:22px 0 0;font-weight:300;font-size:14px;line-height:1.5;color:#4A4766\"><strong style=\"font-weight:900\">Fuentes: <\u002Fstrong>IBM CEO Study 2026; BCG.<\u002Fp>\n<\u002Farticle><article id=\"tendencia-07\" style=\"scroll-margin-top:60px;padding:clamp(56px,7vw,96px) 0;border-top:1px solid #E3E2EB\">\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(28px,5vw,80px)\">\n<div style=\"flex:1 1 340px;max-width:470px\">\n<div style=\"display:flex;align-items:center;gap:14px;font-weight:900;font-size:13px;letter-spacing:0.18em;color:#FF4F52\"><span style=\"width:40px;height:1px;background:#FF4F52;opacity:0.6;flex:none\"><\u002Fspan><span>TENDENCIA 07<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin:18px 0 0;font-weight:900;font-size:clamp(30px,3.4vw,46px);line-height:1.06;letter-spacing:0.01em;color:#201C4E;text-wrap:balance\">Equipos pequeños de gran capacidad<\u002Fh3>\n<p style=\"margin:22px 0 0;padding-left:18px;border-left:3px solid #FF4F52;font-weight:300;font-style:italic;font-size:clamp(18px,1.6vw,22px);line-height:1.4;color:#201C4E;text-wrap:pretty\">La IA empieza a cambiar dónde aporta valor una persona.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1.3 1 400px;display:flex;flex-direction:column;gap:14px;padding-top:6px\"><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Las herramientas y los agentes aumentan el alcance de los equipos, especialmente en el trabajo digital.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Un mismo equipo puede investigar, diseñar, prototipar, producir y validar con menos dependencias que antes.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Eso no convierte automáticamente productividad en reducción de plantilla.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Sí obliga a revisar la composición de los equipos y el valor diferencial de cada rol.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Cuando ejecutar se vuelve más sencillo, aumentan la importancia de definir, integrar, supervisar y validar.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:clamp(36px,4vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;align-items:stretch\">\n<div style=\"background:#F2F1F6;border-radius:28px;padding:30px 30px 22px\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Qué cambia<\u002Fdiv>\n<ul style=\"list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column\"><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Equipos más multidisciplinares.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Mayor capacidad end-to-end.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Menos traspasos.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Nuevos estándares de calidad.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Nuevas métricas de productividad.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Más peso del criterio y la responsabilidad sobre el resultado.<\u002Fspan><\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div style=\"border:1px solid #E3E2EB;border-radius:28px;padding:30px;display:flex;flex-direction:column\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Ejemplo<\u002Fdiv>\n<div style=\"margin-top:16px;display:flex;flex-direction:column;gap:10px\"><p style=\"margin:0;font-weight:300;font-size:clamp(18px,1.5vw,21px);line-height:1.5;color:#201C4E;text-wrap:pretty\">Un equipo reducido investiga, prototipa, programa y prueba con apoyo de IA.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#201C4E;border-radius:28px;padding:30px;display:flex;flex-direction:column\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Pregunta para la organización<\u002Fdiv>\n<div style=\"margin-top:16px\"><p style=\"margin:0;font-weight:900;font-size:clamp(20px,1.8vw,24px);line-height:1.3;color:#fff;text-wrap:pretty\"><strong style=\"font-weight:900\">Si producir deja de ser el principal cuello de botella, ¿dónde necesitamos ahora nuestra mejor capacidad?<\u002Fstrong><\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:22px 0 0;font-weight:300;font-size:14px;line-height:1.5;color:#4A4766\"><strong style=\"font-weight:900\">Fuentes: <\u002Fstrong>Microsoft Work Trend Index 2026; Gartner.<\u002Fp>\n<\u002Farticle><\u002Fdiv><\u002Fsection>\n<section id=\"bloque-3\" style=\"scroll-margin-top:60px;background:#201C4E;color:#fff;padding:clamp(80px,10vw,140px) 0 clamp(72px,9vw,120px)\"><div style=\"max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,72px);\">\n<div style=\"font-weight:900;font-size:clamp(64px,9vw,128px);line-height:0.9;color:#FF4F52\"><span style=\"opacity:0.55\">/<\u002Fspan>03<\u002Fdiv>\n<div style=\"margin-top:28px\"><div style=\"display:flex;align-items:center;gap:14px;font-weight:900;font-size:13px;letter-spacing:0.18em;color:#fff\"><span style=\"width:40px;height:1px;background:#fff;opacity:0.6;flex:none\"><\u002Fspan><span>BLOQUE 03 · CONSTRUIR<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(32px,5vw,80px)\">\n<div style=\"flex:1 1 420px;max-width:620px\"><h2 style=\"margin:20px 0 0;font-weight:900;font-size:clamp(32px,4.4vw,58px);line-height:1.04;letter-spacing:0.01em;color:#fff;text-wrap:balance\">La IA empieza a cambiar no solo cómo trabajamos, sino lo que podemos crear.<\u002Fh2><\u002Fdiv>\n<div style=\"flex:1 1 380px;display:flex;flex-direction:column;gap:16px;padding-top:26px\"><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:rgba(255,255,255,0.86);text-wrap:pretty\">La primera ola de adopción se ha concentrado en eficiencia.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:rgba(255,255,255,0.86);text-wrap:pretty\">La siguiente empieza a abrir otra pregunta:<\u002Fp><p style=\"margin:8px 0 0;font-weight:900;font-size:clamp(20px,1.9vw,26px);line-height:1.3;color:#fff;text-wrap:pretty\"><strong style=\"font-weight:900\">¿Qué productos, servicios y experiencias son ahora posibles?<\u002Fstrong><\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:rgba(255,255,255,0.86);text-wrap:pretty\">La IA deja de limitarse a mejorar la operación actual y empieza a influir en la propia propuesta de valor.<\u002Fp><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section style=\"background:#fff\"><div style=\"max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,72px);\"><article id=\"tendencia-08\" style=\"scroll-margin-top:60px;padding:clamp(56px,7vw,96px) 0;border-top:none\">\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(28px,5vw,80px)\">\n<div style=\"flex:1 1 340px;max-width:470px\">\n<div style=\"display:flex;align-items:center;gap:14px;font-weight:900;font-size:13px;letter-spacing:0.18em;color:#FF4F52\"><span style=\"width:40px;height:1px;background:#FF4F52;opacity:0.6;flex:none\"><\u002Fspan><span>TENDENCIA 08<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin:18px 0 0;font-weight:900;font-size:clamp(30px,3.4vw,46px);line-height:1.06;letter-spacing:0.01em;color:#201C4E;text-wrap:balance\">Innovación y productos AI-native<\u002Fh3>\n<p style=\"margin:22px 0 0;padding-left:18px;border-left:3px solid #FF4F52;font-weight:300;font-style:italic;font-size:clamp(18px,1.6vw,22px);line-height:1.4;color:#201C4E;text-wrap:pretty\">De mejorar lo existente a crear algo que antes no era viable.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1.3 1 400px;display:flex;flex-direction:column;gap:14px;padding-top:6px\"><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">La Inteligencia Artificial permite acelerar prototipos, experimentar con menor coste e incorporar capacidades inteligentes directamente en productos y servicios.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">El cambio relevante no consiste en añadir una funcionalidad de IA.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Consiste en explorar propuestas cuyo valor depende precisamente de esa capacidad.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:clamp(36px,4vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;align-items:stretch\">\n<div style=\"background:#F2F1F6;border-radius:28px;padding:30px 30px 22px\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Qué cambia<\u002Fdiv>\n<ul style=\"list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column\"><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Experimentación más rápida.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Nuevas propuestas de valor.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Nuevos modelos de servicio.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Productos que aprenden o se adaptan.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Mayor conexión entre tecnología, producto y negocio.<\u002Fspan><\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div style=\"border:1px solid #E3E2EB;border-radius:28px;padding:30px;display:flex;flex-direction:column\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Ejemplo<\u002Fdiv>\n<div style=\"margin-top:16px;display:flex;flex-direction:column;gap:10px\"><p style=\"margin:0;font-weight:300;font-size:clamp(18px,1.5vw,21px);line-height:1.5;color:#201C4E;text-wrap:pretty\">Un fabricante empieza a comercializar servicios de optimización de operaciones además de maquinaria.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#201C4E;border-radius:28px;padding:30px;display:flex;flex-direction:column\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Pregunta para la organización<\u002Fdiv>\n<div style=\"margin-top:16px\"><p style=\"margin:0;font-weight:900;font-size:clamp(20px,1.8vw,24px);line-height:1.3;color:#fff;text-wrap:pretty\"><strong style=\"font-weight:900\">¿Estamos utilizando IA para mejorar nuestro negocio actual o para descubrir el siguiente?<\u002Fstrong><\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:22px 0 0;font-weight:300;font-size:14px;line-height:1.5;color:#4A4766\"><strong style=\"font-weight:900\">Fuentes: <\u002Fstrong>McKinsey State of AI; PwC CEO Survey 2026.<\u002Fp>\n<\u002Farticle><article id=\"tendencia-09\" style=\"scroll-margin-top:60px;padding:clamp(56px,7vw,96px) 0;border-top:1px solid #E3E2EB\">\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(28px,5vw,80px)\">\n<div style=\"flex:1 1 340px;max-width:470px\">\n<div style=\"display:flex;align-items:center;gap:14px;font-weight:900;font-size:13px;letter-spacing:0.18em;color:#FF4F52\"><span style=\"width:40px;height:1px;background:#FF4F52;opacity:0.6;flex:none\"><\u002Fspan><span>TENDENCIA 09<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin:18px 0 0;font-weight:900;font-size:clamp(30px,3.4vw,46px);line-height:1.06;letter-spacing:0.01em;color:#201C4E;text-wrap:balance\">Experiencia de cliente agéntica<\u002Fh3>\n<p style=\"margin:22px 0 0;padding-left:18px;border-left:3px solid #FF4F52;font-weight:300;font-style:italic;font-size:clamp(18px,1.6vw,22px);line-height:1.4;color:#201C4E;text-wrap:pretty\">El cliente ya no siempre estará al otro lado de la interfaz.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1.3 1 400px;display:flex;flex-direction:column;gap:14px;padding-top:6px\"><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Asistentes y agentes empiezan a participar en la relación entre clientes y empresas.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Pueden comparar, buscar, recomendar o ejecutar acciones en nombre del usuario.<\u002Fp><p style=\"margin:0;font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:#4A4766;text-wrap:pretty\">Esto introduce nuevos puntos de intermediación y obliga a revisar el diseño tradicional de la experiencia.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:clamp(36px,4vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;align-items:stretch\">\n<div style=\"background:#F2F1F6;border-radius:28px;padding:30px 30px 22px\">\n<div style=\"font-weight:900;font-size:13px;letter-spacing:0.16em;color:#FF4F52\">Qué cambia<\u002Fdiv>\n<ul style=\"list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column\"><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Journeys humanos y agénticos.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Información de producto más estructurada.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Datos actualizados y fiables.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid #E3E2EB;font-weight:300;font-size:16px;line-height:1.45;color:#201C4E\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF4F52;flex:none;transform:translateY(-2px)\"><\u002Fspan><span>Nuevas formas de intermediación.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:14p
